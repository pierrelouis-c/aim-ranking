name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Create server .env file
        run: |
          echo "${{ secrets.DEPLOY_ENV_VARIABLES_API }}" > server/.env

      - name: Create web .env file
        run: |
          echo "${{ secrets.DEPLOY_ENV_VARIABLES_FRONT }}" > web/.env

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Deploy frontend build
        uses: burnett01/rsync-deployments@v8
        with:
          switches: -avzr --delete
          path: web/dist/
          remote_path: ${{ secrets.DEPLOY_PATH_FRONT }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_port: ${{ secrets.DEPLOY_PORT }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      - name: Deploy API server
        uses: burnett01/rsync-deployments@v8
        with:
          switches: -avzr --delete --exclude node_modules --exclude .env.example
          path: server/
          remote_path: ${{ secrets.DEPLOY_PATH_API }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_port: ${{ secrets.DEPLOY_PORT }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      - name: Install deps, push schema, restart
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use node
            cd ${{ secrets.DEPLOY_PATH_API }}
            npm ci
            npx prisma generate
            npx prisma db push --skip-generate
            pm2 restart API_AIM_RANKING || pm2 start src/index.js --name API_AIM_RANKING
            pm2 save
